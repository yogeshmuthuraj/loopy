<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loopy</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --muted: #a0a4ae;
        --text: #e6e8ee;
        --accent: #4f8cff;
        --accent-2: #23c483;
        --border: #232732;
      }
      :root[data-theme="light"] {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --muted: #667085;
        --text: #0b0f19;
        --accent: #2563eb;
        --accent-2: #16a34a;
        --border: #d0d5dd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 12px; /* spacing on all 4 sides */
        gap: 10px;
      }
      header {
        display: grid;
        grid-template-columns: auto 1fr auto auto auto;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        border-radius: 10px;
        margin-top: 10px; /* extra blank space on top */
      }
      button.primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary:disabled { opacity: 0.6; cursor: default; }
      input[type="search"] {
        flex: 1;
        background: #0c0e12;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 6px;
      }
      :root[data-theme="light"] input[type="search"] {
        background: #f3f4f6;
      }
      .status { color: var(--muted); font-size: 12px; }
      main { display: grid; grid-template-columns: 280px 1fr; gap: 10px; overflow: hidden; }
      aside#sidebar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
        min-width: 0;
      }
      .side-title { font-weight: 700; font-size: 13px; }
      .side-controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .side-controls input { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
      .collections { overflow: auto; display: grid; gap: 4px; }
      .col-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
      .col-item:hover { background: rgba(255,255,255,0.05); }
      :root[data-theme="light"] .col-item:hover { background: rgba(0,0,0,0.05); }
      .col-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .col-count { color: var(--muted); font-size: 12px; }
      #list {
        overflow: auto;
        padding: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .item {
        display: grid;
        grid-template-columns: 26px 1fr auto auto; /* thumb, meta (full), ext, heart */
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        cursor: default;
        border-radius: 6px;
      }
      .item:hover { background: rgba(255,255,255,0.03); }
      .item.playing { background: rgba(79,140,255,0.15); border-left: 3px solid var(--accent); }
      :root[data-theme="light"] .item.playing { background: rgba(37,99,235,0.12); }
      :root[data-theme="light"] .item:hover { background: rgba(0,0,0,0.03); }
      .play {
        width: 20px; height: 20px; border-radius: 50%;
        display: grid; place-items: center;
        color: #fff; background: #2b2f3a; font-size: 12px;
      }
      .meta { display: flex; flex-direction: column; min-width: 0; }
      .name { font-weight: 600; white-space: normal; word-break: break-word; }
      .path { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ext { color: var(--muted); font-size: 12px; padding-left: 8px; }
      .thumb { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; background: #2b2f3a; display: inline-block; }
      /* menu removed per request */
      .dropdown { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); min-width: 200px; z-index: 9999; }
      .dropdown .item { border: 0; padding: 8px 10px; grid-template-columns: 1fr; }
      .dropdown .item:hover { background: rgba(255,255,255,0.06); }
      :root[data-theme="light"] .dropdown .item:hover { background: rgba(0,0,0,0.06); }
      .heart { width: 24px; height: 24px; display: grid; place-items: center; background: transparent; border: 1px solid #ffffff; color: var(--text); cursor: pointer; font-size: 14px; line-height: 1; border-radius: 50%; }
      .heart.active { color: #ef4444; border-color: #ef4444; }
      :root[data-theme="light"] .heart { border-color: #0b0f19; }
      :root[data-theme="light"] .heart.active { color: #dc2626; border-color: #dc2626; }
      .wave { width: 100%; height: 56px; }
      footer { padding: 8px 12px; border: 1px solid var(--border); border-top: 1px solid var(--border); background: var(--panel); display: grid; gap: 6px; border-radius: 10px; }
      footer { margin-bottom: 10px; } /* extra blank space at bottom */
      #now { color: var(--muted); font-size: 12px; }
      audio { width: 100%; }
      .empty { padding: 24px; color: var(--muted); }
      .brand { font-weight: 800; font-size: 16px; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Loopy</div>
      <input id="query" type="search" placeholder="Search name or path…" />
      <button id="theme" class="ghost" title="Toggle theme">🌙</button>
      <button id="choose" class="primary">Choose Folder…</button>
      <div id="count" class="status">0 items</div>
    </header>
    <main>
      <aside id="sidebar">
        <div class="side-title">Collections</div>
        <div class="side-controls">
          <input id="new-col" placeholder="New collection name" />
          <button id="add-col" class="ghost">Add</button>
        </div>
        <div class="collections" id="collections">
          <div class="col-item" data-filter="all"><span class="col-name">All</span><span class="col-count" id="count-all">0</span></div>
          <div class="col-item" data-filter="favorites"><span class="col-name">Favorites</span><span class="col-count" id="count-fav">0</span></div>
          <!-- dynamic collections below -->
        </div>
      </aside>
      <div id="list" aria-label="Audio loops list"></div>
    </main>
    <footer>
      <div id="now">No file selected</div>
      <audio id="player" controls preload="none"></audio>
    </footer>

    <script src="renderer.js"></script>
  </body>
  </html>
